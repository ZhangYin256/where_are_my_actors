name: rehearsal-bot

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: rehearsal-napcat
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
    ports:
      # NapCat WebUI（首次扫码登录、配置 OneBot 网络）
      - "6099:6099"
    volumes:
      - ./deploy/napcat/config:/app/napcat/config
      - ./deploy/napcat/qq:/app/.config/QQ
    networks:
      - rehearsal

  bot:
    build:
      context: .
    container_name: rehearsal-bot
    restart: unless-stopped
    depends_on:
      - napcat
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - REHEARSAL_DB_PATH=/data/rehearsal.db
      - REHEARSAL_HEARTBEAT_PATH=/data/heartbeat
      - REHEARSAL_LOG_DIR=/logs
      # 容器网络内通过服务名访问 NapCat 的 OneBot WebSocket 服务
      - ONEBOT_WS_URLS=["ws://napcat:3001"]
    volumes:
      - ./data:/data
      - ./logs:/logs
    networks:
      - rehearsal

networks:
  rehearsal:
    driver: bridge
